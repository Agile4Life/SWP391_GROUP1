</head>

    // Calculate dimensions
    const ROW_H = 18;
    const HEADER_H = 28;
    const COL_W = 250;
    const PAD = 8;

    function getTableHeight(t) { return HEADER_H + t.cols.length * ROW_H + PAD; }
    function getTableCenter(t) {
        const h = getTableHeight(t);
        return { x: t.x + COL_W / 2, y: t.y + h / 2 };
    }

    // Canvas size
    let maxX = 0, maxY = 0;
    tables.forEach(t => {
        maxX = Math.max(maxX, t.x + COL_W + 40);
        maxY = Math.max(maxY, t.y + getTableHeight(t) + 40);
    });
    canvas.width = maxX * dpr;
    canvas.height = maxY * dpr;
    canvas.style.width = maxX + 'px';
    canvas.style.height = maxY + 'px';
    ctx.scale(dpr, dpr);

    // Draw relationships first (behind tables)
    function drawRelationships() {
        const tableMap = {};
        tables.forEach(t => tableMap[t.name] = t);

        tables.forEach(t => {
            t.cols.forEach((col, ci) => {
                if (col.fk && tableMap[col.fk]) {
                    const target = tableMap[col.fk];
                    const fromY = t.y + HEADER_H + ci * ROW_H + ROW_H / 2;
                    const fromX = t.x;
                    const toC = getTableCenter(target);

                    // Determine connection points
                    let sx, sy, ex, ey;
                    sx = t.x + COL_W / 2;
                    sy = fromY;

                    // Find closest edge of target
                    const th = getTableHeight(target);
                    const tCx = target.x + COL_W / 2;
                    const tCy = target.y + th / 2;

                    // Connect to nearest edge
                    if (Math.abs(sx - tCx) > Math.abs(sy - tCy)) {
                        // Horizontal connection
                        if (sx > tCx) {
                            sx = t.x; ex = target.x + COL_W;
                        } else {
                            sx = t.x + COL_W; ex = target.x;
                        }
                        ey = Math.max(target.y + 10, Math.min(target.y + th - 10, sy));
                    } else {
                        // Vertical connection
                        if (sy > tCy) {
                            sy = t.y; ey = target.y + th;
                        } else {
                            sy = t.y + getTableHeight(t); ey = target.y;
                        }
                        ex = Math.max(target.x + 10, Math.min(target.x + COL_W - 10, sx));
                    }

                    ctx.beginPath();
                    ctx.strokeStyle = '#999';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([]);

                    // Draw line with a bend
                    if (Math.abs(sx - ex) > 20 && Math.abs(sy - ey) > 20) {
                        const mx = (sx + ex) / 2;
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(mx, sy);
                        ctx.lineTo(mx, ey);
                        ctx.lineTo(ex, ey);
                    } else {
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(ex, ey);
                    }
                    ctx.stroke();

                    // Draw diamond (many side)
                    ctx.beginPath();
                    ctx.fillStyle = '#666';
                    const dx = ex - sx, dy = ey - sy;
                    const len = Math.sqrt(dx*dx + dy*dy);
                    if (len > 0) {
                        ctx.arc(ex, ey, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });
        });
    }

    function drawTable(t) {
        const h = getTableHeight(t);
        const color = MODULE_COLORS[t.module] || '#fff';
        const headerColor = HEADER_COLORS[t.module] || '#333';

        // Shadow
        ctx.shadowColor = 'rgba(0,0,0,0.15)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        // Body
        ctx.fillStyle = '#fff';
        ctx.fillRect(t.x, t.y, COL_W, h);
        ctx.shadowColor = 'transparent';

        // Header
        ctx.fillStyle = headerColor;
        ctx.fillRect(t.x, t.y, COL_W, HEADER_H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(t.name, t.x + COL_W / 2, t.y + 18);

        // Columns
        ctx.textAlign = 'left';
        t.cols.forEach((col, i) => {
            const cy = t.y + HEADER_H + i * ROW_H;

            // Alternate row bg
            ctx.fillStyle = i % 2 === 0 ? color : '#fff';
            ctx.fillRect(t.x, cy, COL_W, ROW_H);

            // Icons
            let prefix = '  ';
            if (col.pk && col.fk) prefix = '🔑🔗';
            else if (col.pk) prefix = '🔑';
            else if (col.fk) prefix = '  🔗';

            ctx.fillStyle = '#333';
            ctx.font = '11px Segoe UI, sans-serif';
            ctx.fillText(prefix, t.x + 2, cy + 13);

            // Column name
            ctx.font = col.pk ? 'bold 11px Segoe UI, sans-serif' : '11px Segoe UI, sans-serif';
            ctx.fillStyle = col.fk ? '#0d47a1' : '#333';
            ctx.fillText(col.n, t.x + 30, cy + 13);

            // Type
            ctx.fillStyle = '#888';
            ctx.font = '10px Consolas, monospace';
            ctx.textAlign = 'right';
            let typeStr = col.t;
            if (col.null) typeStr += '?';
            if (col.u) typeStr += ' UQ';
            ctx.fillText(typeStr, t.x + COL_W - 4, cy + 13);
            ctx.textAlign = 'left';
        });

        // Border
        ctx.strokeStyle = headerColor;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(t.x, t.y, COL_W, h);
    }

    // Render
    ctx.clearRect(0, 0, maxX, maxY);
    drawRelationships();
    tables.forEach(drawTable);
    </script>
</body>
</html>
